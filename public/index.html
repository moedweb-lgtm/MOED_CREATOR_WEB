<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <title>MOED Creator</title>
  <style>
    * { box-sizing: border-box; }
    body { margin: 0; font-family: Arial, sans-serif; background: #111827; color: white; }
    .layout { min-height: 100vh; display: grid; grid-template-columns: 280px 1fr; }
    aside { background: #0b1220; padding: 18px; border-right: 1px solid #263244; }
    main { height: 100vh; display: flex; flex-direction: column; }
    h1 { margin: 0 0 16px; }
    input, select, textarea, button {
      width: 100%; margin: 7px 0; padding: 12px; border: 0; border-radius: 8px; font-size: 15px;
    }
    input, select, textarea { background: #1f2937; color: white; outline: 1px solid #374151; }
    button { background: #10b981; color: #04130f; font-weight: 700; cursor: pointer; }
    button.secondary { background: #374151; color: white; }
    button.google { background: white; color: #111827; }
    .hidden { display: none; }
    .error { color: #fca5a5; font-size: 14px; }
    .muted { color: #9ca3af; font-size: 13px; }
    .chat { flex: 1; overflow-y: auto; padding: 24px; }
    .msg { max-width: 850px; margin: 0 auto 16px; padding: 14px 16px; border-radius: 8px; white-space: pre-wrap; line-height: 1.45; }
    .you { background: #1f2937; }
    .bot { background: #10251f; }
    .bar { border-top: 1px solid #263244; padding: 16px 24px; }
    .composer { max-width: 850px; margin: auto; display: flex; gap: 10px; }
    .composer textarea { margin: 0; min-height: 52px; resize: vertical; }
    .composer button { width: 120px; margin: 0; }
  </style>
</head>
<body>
  <div class="layout">
    <aside>
      <h1>MOED Creator</h1>

      <section id="auth">
        <button class="google" onclick="loginGoogle()">Entrar con Google</button>
        <input id="email" type="email" placeholder="Correo" />
        <input id="password" type="password" placeholder="Contraseña" />
        <button onclick="loginEmail()">Iniciar sesión</button>
        <button class="secondary" onclick="registerEmail()">Registrarse</button>
        <p id="authError" class="error"></p>
      </section>

      <section id="roleBox" class="hidden">
        <select id="role">
          <option value="visitante">Visitante</option>
          <option value="moderador">Moderador</option>
        </select>
        <input id="accessCode" placeholder="Código de acceso" />
        <button onclick="enterMoed()">Entrar a MOED</button>
        <p id="roleError" class="error"></p>
      </section>

      <section id="modBox" class="hidden">
        <h3>Moderador</h3>
        <input id="codeLabel" placeholder="Nombre del código" />
        <button onclick="createVisitorCode()">Crear código visitante</button>
        <p id="newCode"></p>
      </section>

      <section id="sessionBox" class="hidden">
        <p id="userInfo"></p>
        <button class="secondary" onclick="newChat()">Nuevo chat</button>
        <button class="secondary" onclick="logout()">Salir</button>
      </section>

      <p class="muted">MOED Creator · mamarcosane · Vento · 2026</p>
    </aside>

    <main>
      <div id="chat" class="chat">
        <div class="msg bot">MOED Creator: Inicia sesión para empezar.</div>
      </div>
      <div class="bar">
        <div class="composer">
          <textarea id="message" placeholder="Escribe tu mensaje..."></textarea>
          <button onclick="sendMessage()">Enviar</button>
        </div>
      </div>
    </main>
  </div>

  <script type="module">
    import { initializeApp } from "https://www.gstatic.com/firebasejs/10.12.4/firebase-app.js";
    import {
      getAuth,
      GoogleAuthProvider,
      signInWithPopup,
      createUserWithEmailAndPassword,
      signInWithEmailAndPassword,
      signOut
    } from "https://www.gstatic.com/firebasejs/10.12.4/firebase-auth.js";

    const firebaseConfig = {
      apiKey: "AIzaSyCjBvWQjWIxinAkitySxCepeips0SJ1FoI",
      authDomain: "moedspeed-d67a9.firebaseapp.com",
      projectId: "moedspeed-d67a9",
      storageBucket: "moedspeed-d67a9.firebasestorage.app",
      messagingSenderId: "950914239175",
      appId: "1:950914239175:web:32f8e742a836f752618ce2",
      measurementId: "G-QBTKECGGS6"
    };

    const firebaseApp = initializeApp(firebaseConfig);
    const auth = getAuth(firebaseApp);
    const provider = new GoogleAuthProvider();

    let currentUser = null;
    let token = "";
    let chatId = "";

    window.loginGoogle = async function () {
      try {
        clearErrors();
        const result = await signInWithPopup(auth, provider);
        currentUser = result.user;
        showRoleBox();
      } catch (error) {
        authError.textContent = error.message;
      }
    };

    window.registerEmail = async function () {
      try {
        clearErrors();
        const result = await createUserWithEmailAndPassword(auth, email.value, password.value);
        currentUser = result.user;
        showRoleBox();
      } catch (error) {
        authError.textContent = error.message;
      }
    };

    window.loginEmail = async function () {
      try {
        clearErrors();
        const result = await signInWithEmailAndPassword(auth, email.value, password.value);
        currentUser = result.user;
        showRoleBox();
      } catch (error) {
        authError.textContent = error.message;
      }
    };

    window.enterMoed = async function () {
      try {
        clearErrors();

        const idToken = await currentUser.getIdToken();
        const selectedRole = role.value;

        const res = await fetch("/api/login", {
          method: "POST",
          headers: { "Content-Type": "application/json" },
          body: JSON.stringify({
            idToken,
            role: selectedRole,
            code: accessCode.value
          })
        });

        const data = await res.json();

        if (!res.ok) {
          roleError.textContent = data.error || "No se pudo entrar.";
          return;
        }

        token = data.token;

        auth.classList?.add;
        document.getElementById("auth").classList.add("hidden");
        roleBox.classList.add("hidden");
        sessionBox.classList.remove("hidden");
        userInfo.textContent = `${data.name} · ${data.role}`;

        if (data.role === "moderador") {
          modBox.classList.remove("hidden");
        }

        setChat(`MOED Creator: Hola ${data.name}. Estás en modo ${data.role}.`);
      } catch (error) {
        roleError.textContent = error.message;
      }
    };

    window.createVisitorCode = async function () {
      const res = await fetch("/api/codes", {
        method: "POST",
        headers: { "Content-Type": "application/json" },
        body: JSON.stringify({ token, label: codeLabel.value })
      });

      const data = await res.json();
      newCode.textContent = data.code ? `Código creado: ${data.code}` : data.error;
    };

    window.sendMessage = async function () {
      const text = message.value.trim();
      if (!text) return;

      addMessage("Tú", text, "you");
      message.value = "";
      addMessage("MOED Creator", "Pensando...", "bot");

      const res = await fetch("/api/chat", {
        method: "POST",
        headers: { "Content-Type": "application/json" },
        body: JSON.stringify({ token, chatId, message: text })
      });

      const data = await res.json();
      removeThinking();

      if (data.chatId) chatId = data.chatId;

      addMessage("MOED Creator", data.reply || data.error || "Error.", "bot");
    };

    window.newChat = function () {
      chatId = "";
      setChat("MOED Creator: Nuevo chat iniciado.");
    };

    window.logout = async function () {
      await signOut(auth);
      currentUser = null;
      token = "";
      chatId = "";
      location.reload();
    };

    function showRoleBox() {
      roleBox.classList.remove("hidden");
    }

    function clearErrors() {
      authError.textContent = "";
      roleError.textContent = "";
    }

    function setChat(text) {
      chat.innerHTML = "";
      addMessage("", text, "bot");
    }

    function addMessage(who, text, cls) {
      const div = document.createElement("div");
      div.className = "msg " + cls;
      div.textContent = who ? `${who}: ${text}` : text;
      chat.appendChild(div);
      chat.scrollTop = chat.scrollHeight;
    }

    function removeThinking() {
      const last = chat.lastElementChild;
      if (last && last.textContent.includes("Pensando...")) {
        last.remove();
      }
    }
  </script>
</body>
</html>
