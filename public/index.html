<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <title>MOED Creator</title>
  <style>
    body {
      margin: 0;
      font-family: Arial, sans-serif;
      background: #101820;
      color: white;
    }

    main {
      max-width: 850px;
      margin: auto;
      padding: 24px;
    }

    h1 {
      margin-top: 0;
    }

    input,
    select,
    textarea,
    button {
      width: 100%;
      box-sizing: border-box;
      margin: 8px 0;
      padding: 12px;
      border-radius: 8px;
      border: 0;
      font-size: 16px;
    }

    textarea {
      min-height: 90px;
      resize: vertical;
    }

    button {
      background: #00c2a8;
      color: #04100e;
      font-weight: 700;
      cursor: pointer;
    }

    .card {
      background: #182632;
      padding: 18px;
      border-radius: 10px;
      margin-bottom: 16px;
    }

    .chat {
      min-height: 300px;
      max-height: 480px;
      overflow-y: auto;
      background: #0c131a;
      padding: 14px;
      border-radius: 10px;
      white-space: pre-wrap;
    }

    .hidden {
      display: none;
    }

    .msg {
      margin: 12px 0;
      line-height: 1.45;
    }

    .you {
      color: #8bd3ff;
    }

    .bot {
      color: #a7f3d0;
    }

    .error {
      color: #ff9a9a;
    }

    .credits {
      opacity: 0.8;
      font-size: 14px;
      margin-top: 18px;
    }
  </style>
</head>
<body>
  <main>
    <h1>MOED Creator</h1>

    <section id="login" class="card">
      <input id="name" placeholder="Tu nombre" />

      <select id="role">
        <option value="visitante">Visitante</option>
        <option value="trabajador">Trabajador</option>
        <option value="moderador">Moderador</option>
      </select>

      <input id="code" placeholder="Codigo de acceso" />

      <button onclick="login()">Entrar</button>
      <p id="loginError" class="error"></p>
    </section>

    <section id="app" class="card hidden">
      <h2 id="mode"></h2>

      <div id="chat" class="chat"></div>

      <textarea id="message" placeholder="Escribe cualquier cosa sobre MOED"></textarea>
      <button onclick="sendMessage()">Enviar</button>
    </section>

    <p class="credits">
      MOED Creator. Creado por mamarcosane. Asistente: Vento. Proyecto MOED 2026.
    </p>
  </main>

  <script>
    let token = "";

    async function login() {
      const loginError = document.getElementById("loginError");
      loginError.textContent = "";

      const res = await fetch("/api/login", {
        method: "POST",
        headers: {
          "Content-Type": "application/json"
        },
        body: JSON.stringify({
          name: document.getElementById("name").value,
          role: document.getElementById("role").value,
          code: document.getElementById("code").value
        })
      });

      const data = await res.json();

      if (!res.ok) {
        loginError.textContent = data.error || "No se pudo iniciar sesion.";
        return;
      }

      token = data.token;

      document.getElementById("login").classList.add("hidden");
      document.getElementById("app").classList.remove("hidden");
      document.getElementById("mode").textContent = "Modo " + data.role;

      addMessage(
        "MOED Creator",
        "Hola " + data.name + ". Ya puedes preguntarme cualquier cosa sobre MOED.",
        "bot"
      );
    }

    async function sendMessage() {
      const box = document.getElementById("message");
      const text = box.value.trim();

      if (!text) return;

      addMessage("Tu", text, "you");
      box.value = "";

      addMessage("MOED Creator", "Pensando...", "bot");

      const res = await fetch("/api/chat", {
        method: "POST",
        headers: {
          "Content-Type": "application/json"
        },
        body: JSON.stringify({
          token,
          message: text
        })
      });

      const data = await res.json();

      removeLastThinking();
      addMessage("MOED Creator", data.reply || data.error || "Error.", res.ok ? "bot" : "error");
    }

    function addMessage(who, text, cls) {
      const chat = document.getElementById("chat");
      const div = document.createElement("div");

      div.className = "msg " + cls;
      div.textContent = who + ": " + text;

      chat.appendChild(div);
      chat.scrollTop = chat.scrollHeight;
    }

    function removeLastThinking() {
      const chat = document.getElementById("chat");
      const last = chat.lastElementChild;

      if (last && last.textContent === "MOED Creator: Pensando...") {
        last.remove();
      }
    }
  </script>
</body>
</html>
